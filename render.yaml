services:
  - type: web
    name: ai_native_backend
    env: node
    buildCommand: npm install && npx tsc
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
